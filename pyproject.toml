[project]
name = "pysueca"
version = "0.1.0"
description = "Sueca - Jogo de Cartas"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pysueca = "pysueca:src.pysueca.main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
